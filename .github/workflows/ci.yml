name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # opened/synchronize: empty ref defaults to github.ref = refs/pull/:n/merge
          # (PR head merged into base, so new tests run). closed+merged: base branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Set up Node.js for crypto interop tests
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: '22'

      - name: Test root and relaykit modules
        run: make test

  database-mysql:
    name: MySQL ${{ matrix.version }} compatibility
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['5.7', '8.0']

    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      GOWORK: 'off'
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/newapi_test?parseTime=true&loc=UTC
      TEST_SECURITY_DIALECT: mysql

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # opened/synchronize: empty ref defaults to github.ref = refs/pull/:n/merge
          # (PR head merged into base, so new tests run). closed+merged: base branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Run MySQL migration compatibility test
        run: go test ./controller/ -run "TestTokenMigrationFromChar48ToVarchar128MySQL" -v -count=1

      - name: Run MySQL cross-process idempotency test
        run: go test ./model/ -run "TestCreateTokenIdempotentCrossProcessRace/mysql" -v -count=1

      - name: Run desktop auth acceptance tests on MySQL
        run: go test ./controller/ -run "TestDesktopAcceptance" -v -count=1

  database-postgresql:
    name: PostgreSQL ${{ matrix.version }} compatibility
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['9.6', '16']

    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      GOWORK: 'off'
      TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/newapi_test?sslmode=disable
      TEST_SECURITY_DIALECT: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # opened/synchronize: empty ref defaults to github.ref = refs/pull/:n/merge
          # (PR head merged into base, so new tests run). closed+merged: base branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || '' }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Run PostgreSQL migration compatibility test
        run: go test ./controller/ -run "TestTokenMigrationFromChar48ToVarchar128Postgres" -v -count=1

      - name: Run PostgreSQL cross-process idempotency test
        run: go test ./model/ -run "TestCreateTokenIdempotentCrossProcessRace/postgres" -v -count=1

      - name: Run desktop auth acceptance tests on PostgreSQL
        run: go test ./controller/ -run "TestDesktopAcceptance" -v -count=1

  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # opened/synchronize: empty ref defaults to github.ref = refs/pull/:n/merge
          # (PR head merged into base, so new tests run). closed+merged: base branch.
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || '' }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
