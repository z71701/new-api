name: aliai-governance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate governance (PR mode)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/aliai_validate.py . \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}
      - name: Validate governance (push main mode)
        if: github.event_name == 'push'
        run: python scripts/aliai_validate.py .
      - name: Validator self-test
        run: python scripts/aliai_validate.py --self-test
