# ALIAI repository governance manifest. Machine-readable.
# Consumed by scripts/aliai_validate.py and the aliai-cross-repo-coordination skill.
schema_version: "1.1"
project_skill: ".agents/skills/aliai-cross-repo-coordination/SKILL.md"
repo:
  name: "z71701/new-api"                   # this repo: backend
  role: "backend"                          # backend | client | deploy
  authoritative_fields:                     # what this repo is the single source of truth for
    - "API / OpenAPI"
    - "error codes"
    - "runtime switches"
    - "fixtures"
    - "backend release status"
status:
  doc: "docs/STATUS.md"
  machine_file: "docs/status.yml"           # v1.1 machine authority
  last_verified_commit: "598e708adeb15c6f5ad8dda24f448ae0a024238a"  # origin/main HEAD at v1.1 upgrade
handoffs:
  dir: "docs/handoffs"
  readme: "docs/handoffs/README.md"
  schema_version: "1.1"
  required_fields:
    - schema_version
    - producer_repo
    - producer_commit
    - artifact
    - version
    - change_type
    - compatibility
    - contract_refs
    - tests
    - runtime_switches
    - downstream_actions
    - blockers
    - lifecycle_state
    - evidence_phase
pr_template: ".github/PULL_REQUEST_TEMPLATE.md"
validator:
  script: "scripts/aliai_validate.py"
  ci_workflow: ".github/workflows/aliai-governance.yml"
upstream_producers: []                     # this repo is the upstream producer; no upstream contract source
downstream_consumers:
  - repo: "Yohalloo/aliai-desktop"        # desktop client consumes this backend's API contract
    handoff_expected: true
  - repo: "z71701/aliai-deploy"            # deploy repo records image digest from this backend
    handoff_expected: true
cross_repo_rules:
  declare_other_repo_dynamic_state: false # never state another repo's live status as fact
  references_must_be_url_plus_commit: true
  independent_pr_per_repo: true
  preserve_source_sha: true
naming_traps:
  - note: "GitHub branch pr-d-desktop-e2e-acceptance (=PR #8, E2E acceptance contract) is NOT Roadmap PR-D (Manifest/Dashboard)."

# v1.1 status lifecycle — machine authority in docs/status.yml.
status_lifecycle:
  machine_file: "docs/status.yml"
  human_file: "docs/STATUS.md"
  states: [planned, candidate, implemented, verified, released, blocked, failed, superseded]
  transitions:
    - "planned→candidate"
    - "candidate→implemented"
    - "implemented→verified"
    - "verified→released"
    - "implemented→accepted"
    - "implemented→deployed"
    - "any→blocked"
    - "any→failed"
    - "blocked→previous"
    - "failed→previous"
    - "deployed→rolled_back"
    - "any→superseded"
  trigger_paths:
    - "controller/**"
    - "service/**"
    - "model/**"
    - "middleware/**"
    - "router/**"
    - "docs/openapi/**"
    - "docs/*contract*"
    - "testdata/**"
    - "e2e/**"
  required_sections: ["当前阶段", "本仓权威事实", "版本与提交", "开放项", "跨仓引用", "命名陷阱"]
  post_merge_followup:
    enabled: true
    creator: merge_agent
    target_state: implemented
    description: "合并后由 merge agent 创建独立 PR，填入真实 merge SHA"
  post_release_followup:
    enabled: true
    creator: release_deploy_agent
    target_state: released
  role_requirements:
    implemented:
      requires_source_commit: true
      source_commit_format: "40-hex"
    verified:
      requires_tests_passed: true
    released:
      requires_fields: ["backend.image_tag", "backend.image_digest"]
      image_digest_format: "sha256:[a-f0-9]{64}"
    accepted:
      requires_fields: ["client.test_level"]
      test_level_value: real_e2e
      requires_evidence: true
    deployed:
      requires_fields: ["deploy.actual_digest", "deploy.current_tag", "deploy.health_evidence", "deploy.rollback_to"]
